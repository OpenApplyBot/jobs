name: Dell scraper live test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/scrapers/dell_com.py"
      - "backend/scripts/test_scraper.py"
      - ".github/workflows/dell-scraper-smoke.yml"
  workflow_dispatch:

jobs:
  dell-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare JSON output
        run: mkdir -p backend/test-results
      - name: Test Dell listings
        working-directory: backend
        env:
          JOB_HTTP_TIMEOUT: "10"
          DELL_MAX_PAGES: "1"
        run: python scripts/test_scraper.py dell_com --output test-results/dell_com.json
      - name: Upload Dell JSON output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dell-scraper-test-results
          path: backend/test-results/dell_com.json
          if-no-files-found: warn
          retention-days: 7
