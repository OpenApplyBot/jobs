name: Meta scraper live test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/scrapers/metacareers_com.py"
      - "backend/scripts/test_scraper.py"
      - ".github/workflows/meta-scraper-smoke.yml"
  workflow_dispatch:

jobs:
  meta-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JSON output directory
        run: mkdir -p backend/test-results
      - name: Test Meta official careers scraper
        run: |
          docker compose run --build --rm \
            -v "$GITHUB_WORKSPACE/backend/test-results:/app/test-results" \
            api python scripts/test_scraper.py metacareers_com \
            --output test-results/metacareers_com.json
      - name: Upload Meta JSON test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-scraper-test-results
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 7
