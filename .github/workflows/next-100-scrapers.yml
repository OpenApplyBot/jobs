name: Remaining company scrapers (8-way parallel batches)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/next-100-scrapers.yml"
      - "backend/app/scrapers/*.py"
      - "backend/app/scrapers/manifest.json"
      - "backend/scripts/test_scraper.py"

concurrency:
  group: remaining-company-scrapers
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare all remaining manifest entries
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          manifest = json.loads(pathlib.Path("backend/app/scrapers/manifest.json").read_text())
          chosen = []
          seen = set()
          for item in manifest:
              rank = item.get("rank")
              module = pathlib.Path(item.get("module", "")).stem
              if isinstance(rank, int) and rank >= 65 and re.fullmatch(r"[A-Za-z0-9_]+", module):
                  if rank in seen:
                      raise SystemExit(f"Duplicate manifest rank: {rank}")
                  seen.add(rank)
                  if not pathlib.Path("backend/app/scrapers", module + ".py").is_file():
                      raise SystemExit(f"Missing scraper module for rank {rank}: {module}")
                  chosen.append({"rank": rank, "module": module, "company": item.get("company_name", module)})
          chosen.sort(key=lambda x: x["rank"])
          if not chosen:
              raise SystemExit("No remaining scraper entries found at ranks >= 65")
          shards = [{"shard": i, "total_shards": 8} for i in range(8)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": shards}, separators=(",", ":")) + "\n")
              f.write("count=" + str(len(chosen)) + "\n")
          print(f"Prepared {len(chosen)} remaining company scrapers across 8 parallel shards")
          print("Ranks: " + str(chosen[0]["rank"]) + "–" + str(chosen[-1]["rank"]))
          PY

  test:
    name: Shard ${{ matrix.shard }} / 8
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run this shard's live scraper tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ matrix.total_shards }}
          JOB_HTTP_TIMEOUT: "15"
        run: |
          set +e
          mkdir -p backend/test-results
          python - <<'PY'
          import json, os, pathlib
          manifest = json.loads(pathlib.Path("backend/app/scrapers/manifest.json").read_text())
          shard, total = int(os.environ["SHARD"]), int(os.environ["TOTAL_SHARDS"])
          chosen = []
          for item in manifest:
              rank = item.get("rank")
              if isinstance(rank, int) and rank >= 65 and (rank - 65) % total == shard:
                  module = pathlib.Path(item.get("module", "")).stem
                  chosen.append({"rank": rank, "module": module, "company": item.get("company_name", module)})
          chosen.sort(key=lambda x: x["rank"])
          pathlib.Path("backend/test-results/shard-manifest.json").write_text(json.dumps(chosen, indent=2))
          print(f"Shard {shard}: {len(chosen)} companies")
          PY
          failed=0
          while IFS=$'\t' read -r rank module company; do
            [ -n "$module" ] || continue
            echo "::group::Rank $rank — $company ($module)"
            (cd backend && timeout 90s python scripts/test_scraper.py "$module" --output "test-results/$module.json")
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "RESULT PASS rank=$rank module=$module"
            else
              echo "RESULT FAIL rank=$rank module=$module exit=$rc"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < <(python - <<'PY'
          import json, pathlib
          for x in json.loads(pathlib.Path("backend/test-results/shard-manifest.json").read_text()):
              print(f'{x["rank"]}\t{x["module"]}\t{x["company"]}')
          PY
          )
          python - "$failed" "$SHARD" <<'PY'
          import json, pathlib, sys
          failed, shard = int(sys.argv[1]), int(sys.argv[2])
          pathlib.Path(f"backend/test-results/shard-{shard}-summary.json").write_text(json.dumps({"shard": shard, "failed": failed}, indent=2))
          print(f"SHARD SUMMARY shard={shard} failed={failed}")
          PY
          # Make GitHub Actions reflect actual scraper failures; do not report green when all individual tests failed.
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed scraper(s) failed in shard $SHARD"
            exit 1
          fi
          exit 0
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-scrapers-shard-${{ matrix.shard }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 14
