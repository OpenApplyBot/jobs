name: Ericsson scraper live test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/scrapers/ericsson_com.py"
      - "backend/scripts/test_scraper.py"
      - ".github/workflows/ericsson-scraper-smoke.yml"
  workflow_dispatch:

jobs:
  ericsson-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare JSON output
        run: mkdir -p backend/test-results
      - name: Test Ericsson listings
        working-directory: backend
        env:
          JOB_HTTP_TIMEOUT: "10"
          ERICSSON_MAX_PAGES: "1"
          ERICSSON_PAGE_SIZE: "20"
          ERICSSON_DETAIL_LIMIT: "5"
        run: python scripts/test_scraper.py ericsson_com --output test-results/ericsson_com.json
      - name: Upload Ericsson JSON output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ericsson-scraper-test-results
          path: backend/test-results/ericsson_com.json
          if-no-files-found: warn
          retention-days: 7
