name: Sequential live scraper repair audit

on:
  push:
    branches: [main]
    paths:
      - "backend/scripts/test_scrapers.py"
      - "backend/app/scrapers/**"
      - ".github/workflows/sequential-live-scraper-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sequential-live-scraper-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install scraper dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile scraper code
        run: python -m compileall -q backend/app/scrapers backend/scripts/test_scrapers.py

      - name: Test all companies one by one
        env:
          JOB_HTTP_TIMEOUT: "15"
        run: python backend/scripts/test_scrapers.py --workers 1 --report-dir reports

      - name: Upload live audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-live-scraper-audit
          path: reports/scraper-live-test-*
          if-no-files-found: warn
          retention-days: 14
