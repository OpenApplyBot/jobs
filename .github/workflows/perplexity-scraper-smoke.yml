name: Perplexity scraper live test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/scrapers/perplexity_ai.py"
      - "backend/scripts/test_scraper.py"
      - ".github/workflows/perplexity-scraper-smoke.yml"
  workflow_dispatch:

jobs:
  perplexity-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare JSON output
        run: mkdir -p backend/test-results
      - name: Test Perplexity listings
        working-directory: backend
        env:
          JOB_HTTP_TIMEOUT: "10"
          PERPLEXITY_MAX_JOBS: "100"
        run: python scripts/test_scraper.py perplexity_ai --output test-results/perplexity_ai.json
      - name: Upload Perplexity JSON output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perplexity-scraper-test-results
          path: backend/test-results/perplexity_ai.json
          if-no-files-found: warn
          retention-days: 7
